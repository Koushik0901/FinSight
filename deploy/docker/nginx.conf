map $http_x_forwarded_proto $finsight_forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8674;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $finsight_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        # SSE / Copilot streaming: disable buffering so frames arrive immediately
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
