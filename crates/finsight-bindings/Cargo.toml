[package]
name = "finsight-bindings"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["lib"]

# This codegen-only package provides `build_specta_builder()`, the
# `#[tauri::command]` wrappers, and the exporter that writes bindings.ts. It is
# separate from the shipped Tauri package so installers cannot include the
# developer-only exporter.

[[bin]]
name = "export_bindings"
path = "src/bin/export_bindings.rs"
test = false
bench = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
finsight-core = { path = "../finsight-core" }
finsight-providers = { path = "../finsight-providers" }
finsight-agent = { path = "../finsight-agent" }
finsight-api = { path = "../finsight-api" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
specta = { workspace = true, features = ["derive", "serde_json"] }
specta-typescript.workspace = true
tauri-specta.workspace = true

uuid.workspace = true
rusqlite.workspace = true
chrono.workspace = true
reqwest.workspace = true
tauri = { version = "2", features = [] }
# The command wrappers spawn OS notifications via `notifications.rs`; the other
# desktop plugins (single-instance/dialog/opener) left with the dead
# `configure_app` app-lifecycle setup when this became a codegen-only crate.
tauri-plugin-notification = "2"

[dev-dependencies]
# Required explicitly, not inherited: `cargo test --workspace` unifies this
# feature on from the other crates' dev-dependencies and would hide its absence,
# but `cargo test -p finsight-bindings` resolves features from this crate's
# graph alone and would not find `finsight_core::testing`.
finsight-core = { path = "../finsight-core", features = ["testing", "dev-seed"] }
keyring.workspace = true
rusqlite.workspace = true
tempfile.workspace = true
chrono.workspace = true
tokio = { version = "1", features = ["full"] }
