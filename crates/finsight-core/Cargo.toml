[package]
name = "finsight-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
rusqlite.workspace = true
r2d2.workspace = true
r2d2_sqlite.workspace = true
refinery.workspace = true
keyring.workspace = true
rand.workspace = true
rand_chacha.workspace = true
chrono.workspace = true
uuid.workspace = true
specta = { workspace = true, features = ["derive", "chrono", "uuid"] }
zeroize.workspace = true
# Only pulled in by the `testing` feature (see below), never by a release build.
tempfile = { workspace = true, optional = true }

[features]
# Fast database fixtures for tests (`finsight_core::testing`). Other crates
# enable this from their dev-dependencies, so `tempfile` stays out of the
# shipped binaries: dev-dependencies do not contribute features to a normal
# `cargo build`.
testing = ["dep:tempfile"]
# Dev-only sample/demo seed data. The `sample` and `seed` modules are compiled
# only for tests or when this feature is enabled — they must not bloat release
# builds (unlike `testing`, which is also test-gated in lib.rs).
dev-seed = []

[dev-dependencies]
rstest.workspace = true
tempfile.workspace = true
# finsight-core's own tests use the fixtures too.
finsight-core = { path = ".", features = ["testing", "dev-seed"] }
